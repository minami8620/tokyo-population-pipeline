[project]
name = "tokyo-population-pipeline"
version = "0.1.0"
description = "Automated ETL pipeline for Tokyo Metropolitan Government's monthly population estimates"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31",
    "pandas>=2.1",
    "pyarrow>=15",
    "duckdb>=1.0",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.35", "altair>=5"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
tokyo-pop = "tokyo_pop.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tokyo_pop"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
