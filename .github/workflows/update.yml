name: Monthly update

on:
  schedule:
    - cron: "0 3 * * 1" # Mondays 03:00 UTC (12:00 JST)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv pip install -e .
      - run: tokyo-pop update
      - name: Commit new releases
        run: |
          if [ -z "$(git status --porcelain data/processed)" ]; then
            echo "No new releases."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed
          git commit -m "data: add new monthly release"
          git push
